<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — FreshGeek</title>
  <meta name="description" content="Contact form to request quotes or consultations." />
  <link rel="stylesheet" href="assets/css/tailwind.css">
<link rel="stylesheet" href="assets/css/main.css">
  <script defer src="assets/js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">FreshGeek</a>
    <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation">☰</button>
    <nav class="site-nav" id="siteNav">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">About</a>
      <a class="cta" href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">
    <h1>Contact</h1>
    <p>Use this form to request a quote or schedule a discovery call.</p>

    <form id="contactForm" method="POST" action="https://formspree.io/f/YOUR_FORM_ID">
      <label>
        Name
        <input type="text" name="name" required>
      </label>

      <label>
        Email
        <input type="email" name="email" required>
      </label>

      <label>
        Project summary
        <textarea name="message" rows="6" required></textarea>
      </label>

      <input type="hidden" name="_subject" value="New contact from FreshGeek website">
      <button class="btn primary" type="submit">Send</button>
      <p class="muted small">Or email me at <a href="mailto:you@example.com">you@example.com</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>© <span id="yearContact"></span> Your Name</p>
  </footer>
</body>
</html>
